services:
  urbanlabs-site:
    build: .
    container_name: urbanlabs-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    # Endurecimento: filesystem somente leitura, sem capabilities e sem
    # escalonamento de privilégio. Só /tmp e o cache do Next são graváveis (em memória).
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/.next/cache:size=128m,noexec,nosuid,uid=100,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    networks:
      - site

networks:
  site:
    driver: bridge
    driver_opts:
      # Nome fixo para o firewall (DOCKER-USER) bloquear saída deste container:
      # o site não precisa acessar a internet.
      com.docker.network.bridge.name: br-urbanlabs
